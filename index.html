<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ground Control Audio</title>
    <style>
        @font-face {
            font-family: 'PPMonumentExtended';
            src: url('assets/fonts/PPMonumentExtended-Full Family/PPMonumentExtended-Regular.woff2') format('woff2'),
                 url('assets/fonts/PPMonumentExtended-Full Family/PPMonumentExtended-Regular.woff') format('woff'),
                 url('assets/fonts/PPMonumentExtended-Full Family/PPMonumentExtended-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'PPMonumentExtended', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 40px;
        }

        .content {
            text-align: center;
            max-width: 600px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
        }

        a {
            color: #0066cc;
            text-decoration: none;
            font-size: 18px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img src="assets/images/Logo-blue.webp" alt="Ground Control Audio" class="logo">
    <div class="content">
        <p>Ground Control is currently closed for business. Thank you so much for over 9 amazing years. For any inquiries, please contact us via email.</p>
        <a href="mailto:info@groundcontrolaudio.com">info@groundcontrolaudio.com</a>
    </div>
</body>
</html>
